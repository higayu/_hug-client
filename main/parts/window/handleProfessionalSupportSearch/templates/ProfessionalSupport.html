<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <!-- ★ 修正済み CSP（file: を明示的に許可） -->
  <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' https: data: file:;
      style-src 'self' 'unsafe-inline' file:;
      script-src 'self' 'unsafe-inline' file:;
    ">

  <!-- ★ 外部CSS -->
  <link rel="stylesheet" href="../styles/professionalSupport.css">
</head>

<body>

  <!-- ===== ツールバー ===== -->
  <div id="toolbar">
    <div>
      <label>施設ID:</label>
      <input id="facilityIdInput" readonly>
    </div>
    <div>
      <label>施設名:</label>
      <input id="facilityNameInput" readonly>
    </div>
    <div>
      <label>施設URL:</label>
      <input id="facilityUrlInput" readonly>
    </div>

    <!-- ★ 追加：年月 -->
    <div>
      <label>年月:</label>
      <input type="month" id="yearMonthInput">
    </div>

    <div>
      <label>日付:</label>
      <input type="date" id="dateStrInput">
    </div>
    
    <button id="getDataBtn">📥 データ取得</button>


  </div>

  <!-- ===== タブ ===== -->
  <div id="tabs">
    <div id="tabView" class="tab active">📄 ページ表示</div>
    <div id="tabResult" class="tab">📊 取得結果</div>
  </div>

  <!-- ===== コンテンツ ===== -->
  <div id="content">
    <div id="webviews">
      <webview id="left" src= "https://www.hug-ayumu.link/hug/wm/attendance.php" allowpopups>
      </webview>

      <webview id="right" src="https://www.hug-ayumu.link/hug/wm/record_proceedings.php" allowpopups>
      </webview>
    </div>

    <div id="resultView"></div>
  </div>
<script>
  const params = new URLSearchParams(location.search);

  document.addEventListener("DOMContentLoaded", () => {
    facilityIdInput.value = params.get("FACILITY_ID") ?? "";
    facilityNameInput.value = params.get("FACILITY_NAME") ?? "";
    facilityUrlInput.value = params.get("FACILITY_URL") ?? "";
    dateStrInput.value = params.get("DATE_STR") ?? "";
      // "YYYY-MM-DD" → ["YYYY", "MM", "DD"]
    const parts = dateStrInput.value.split("-");
    if (parts.length < 2) return "";
    const [year, month] = parts;
    yearMonthInput.value = `${year}-${month}`;
  });
</script>

  <!-- ===== JavaScript ===== -->
<script type="module" src="../scripts/index.js"></script>


</body>

</html>

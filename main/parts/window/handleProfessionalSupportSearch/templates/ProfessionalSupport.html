<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: sans-serif;
    }

    #toolbar {
      background: #f5f5f5;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    label {
      font-weight: bold;
    }

    input {
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
    }

    button {
      padding: 8px 12px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #005a9e;
    }

    #tabs {
      display: flex;
      background: #eee;
      border-bottom: 2px solid #ccc;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
    }

    .tab.active {
      background: #fff;
      border-top: 2px solid #555;
    }

    #content {
      flex: 1;
      position: relative;
    }

    #webviews {
      position: absolute;
      inset: 0;
      display: flex;
    }

    webview {
      flex: 1;
      border: none;
    }

    #left {
      border-right: 2px solid #ccc;
    }

    #resultView {
      position: absolute;
      inset: 0;
      display: none;
      background: #fafafa;
      overflow: auto;
      padding: 20px;
    }
  </style>
</head>

<body>

  <!-- ===== ツールバー ===== -->
  <div id="toolbar">
    <div>
      <label>施設ID:</label>
      <input id="facilityIdInput" readonly>
    </div>
    <div>
      <label>施設名:</label>
      <input id="facilityNameInput" readonly>
    </div>
    <div>
      <label>施設URL:</label>
      <input id="facilityUrlInput" readonly>
    </div>
    <div>
      <label>日付:</label>
      <input type="date" id="dateStrInput">
    </div>
    <button id="getDataBtn">📥 データ取得</button>
  </div>

  <!-- ===== タブ ===== -->
  <div id="tabs">
    <div id="tabView" class="tab active">📄 ページ表示</div>
    <div id="tabResult" class="tab">📊 取得結果</div>
  </div>

  <div id="content">
    <div id="webviews">
      <webview id="left" src="{{URL1}}" preload="file://{{PRELOAD_PATH}}" allowpopups disablewebsecurity></webview>

      <webview id="right" src="{{URL2}}" preload="file://{{PRELOAD_PATH}}" allowpopups disablewebsecurity></webview>
    </div>

    <div id="resultView"></div>
  </div>

  <script>
    const tabView = document.getElementById("tabView");
    const tabResult = document.getElementById("tabResult");
    const webviews = document.getElementById("webviews");
    const resultView = document.getElementById("resultView");
    const left = document.getElementById("left");
    const right = document.getElementById("right");

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("facilityIdInput").value = "{{FACILITY_ID}}";
      document.getElementById("facilityNameInput").value = "{{FACILITY_NAME}}";
      document.getElementById("facilityUrlInput").value = "{{FACILITY_URL}}";
      document.getElementById("dateStrInput").value = "{{DATE_STR}}";

      console.log("facility:", {
        id: "{{FACILITY_ID}}",
        name: "{{FACILITY_NAME}}",
        url: "{{FACILITY_URL}}"
      });
    });

    tabView.onclick = () => {
      tabView.classList.add("active");
      tabResult.classList.remove("active");
      webviews.style.display = "flex";
      resultView.style.display = "none";
    };

    tabResult.onclick = () => {
      tabResult.classList.add("active");
      tabView.classList.remove("active");
      webviews.style.display = "none";
      resultView.style.display = "block";
    };

    document.getElementById("getDataBtn").onclick = async () => {
      const facilityId = document.getElementById("facilityIdInput").value;
      const dateStr = document.getElementById("dateStrInput").value;

      const url = `https://www.hug-ayumu.link/hug/wm/attendance.php?mode=detail&f_id=${facilityId}&date=${dateStr}`;
      left.src = url;

      console.log("reload left:", url);
    };
  </script>

</body>

</html>
